name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: bazel test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # The network-blocking linux-sandbox needs unprivileged user
      # namespaces; Ubuntu 24.04's AppArmor restricts them by default, and
      # Bazel then falls back to a sandbox with network.
      - name: Allow the linux-sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # .bazelrc: --sandbox_default_allow_network=false, so every scan runs
      # offline on the pinned data (//tests:network_blocked_test checks it).
      - name: bazel test //tests/...
        run: bazel test //tests/... --test_output=errors

      - name: The Java DB (~1 GB download)
        run: bazel test //tests:java_db_test //tests:license_java_db_test --test_output=errors

      - name: A consumer module (external labels, a rules_oci image)
        working-directory: tests/consumer
        run: bazel test //... --test_output=errors

      - name: The pinned binaries match upstream's published checksums
        run: tools/update_versions.sh --check

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: bazel-testlogs/
          if-no-files-found: ignore

  consumer:
    # The release archive (git archive honours .gitattributes export-ignore,
    # as GitHub's tag tarballs do) must load with //... for a consumer, and
    # the extension's tags must resolve as documented.
    name: consumer (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Consumer check
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"
