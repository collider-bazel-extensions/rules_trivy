apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: registry.example.com/agent:1.0
          securityContext:
            privileged: true
